<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The link carries the order's secret: never send it on to other sites. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Your Order — Σenario</title>

  <link rel="stylesheet" href="fonts/fonts.css">

  <style>
    :root {
      --white:   #ffffff;
      --black:   #0d0d0d;
      --orange:  #C4622D;
      --gray:    #9A9A9A;
      --border:  #e8e8e4;
      --green:   #2d7a3c;
      --ff-heading: 'Space Grotesk', sans-serif;
      --ff-body:    'Suisse Intl', 'Inter', sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    body {
      background: var(--white); color: var(--black);
      font-family: var(--ff-body); -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .site-header { padding: 24px 40px; text-align: center; border-bottom: 1px solid var(--border); }
    .site-header__logo { width: 200px; height: auto; margin: 0 auto; }

    .order-wrap { max-width: 560px; margin: 0 auto; padding: 72px 24px 90px; }
    .eyebrow {
      font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gray); margin-bottom: 16px; text-align: center;
    }
    .title {
      font-family: var(--ff-heading); font-weight: 500; font-size: clamp(26px, 4vw, 36px);
      line-height: 1.2; margin-bottom: 12px; text-align: center;
    }
    .status { text-align: center; margin-bottom: 40px; font-size: 12px; color: var(--gray); line-height: 1.7; }
    .badge {
      display: inline-block; padding: 4px 10px; margin-bottom: 10px;
      font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      border: 1px solid var(--border);
    }
    .badge--confirmed, .badge--shipped, .badge--delivered { color: var(--green); border-color: var(--green); }
    .badge--cancelled { color: var(--orange); border-color: var(--orange); }

    .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .item__img { width: 56px; height: 70px; object-fit: cover; background: #f4f4f2; }
    .item__name { font-size: 13px; margin-bottom: 4px; }
    .item__meta, .item__price { font-size: 11px; color: var(--gray); letter-spacing: 0.04em; }
    .item__price { color: var(--black); white-space: nowrap; }

    .totals { padding: 18px 0 0; }
    .row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.06em; padding: 6px 0; }
    .row__label { color: var(--gray); text-transform: uppercase; }
    .row--total { font-size: 13px; border-top: 1px solid var(--black); margin-top: 8px; padding-top: 12px; }

    .ship-to { margin-top: 32px; font-size: 12px; line-height: 1.7; color: #3f3f46; }
    .ship-to strong { display: block; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gray); margin-bottom: 6px; font-weight: 400; }

    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 40px; }
    .btn {
      display: inline-block; width: 100%; padding: 16px; text-align: center;
      font-family: var(--ff-body); font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer; border: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn--primary { background: var(--black); color: var(--white); }
    .btn--primary:hover { background: var(--orange); }
    .btn--primary:disabled { opacity: 0.5; cursor: default; }
    .btn--secondary { background: none; color: var(--black); border: 1px solid var(--border); }
    .btn--secondary:hover { border-color: var(--black); }

    .site-footer { padding: 32px 24px; border-top: 1px solid var(--border); text-align: center; }
    .footer__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin-bottom: 12px; }
    .footer__links a { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray); }
    .footer__links a:hover { color: var(--black); }
    .footer__legal { font-size: 8px; letter-spacing: 0.18em; color: var(--gray); text-transform: uppercase; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <header class="site-header">
    <a href="/"><img class="site-header__logo" src="logo_mark_transparent_orange.png" alt="Σenario"></a>
  </header>

  <main class="order-wrap">
    <p class="eyebrow">Σenario / Order</p>
    <h1 class="title" id="orderTitle">Loading your order…</h1>
    <div class="status" id="orderStatus"></div>
    <div id="orderItems"></div>
    <div class="totals" id="orderTotals" style="display:none">
      <div class="row"><span class="row__label">Subtotal</span><span id="orderSubtotal"></span></div>
      <div class="row"><span class="row__label">Shipping</span><span id="orderShipping"></span></div>
      <div class="row row--total"><span>Total</span><span id="orderTotal"></span></div>
    </div>
    <div class="ship-to" id="orderShipTo" style="display:none"><strong>Shipping to</strong><span id="orderAddress"></span></div>
    <div class="actions">
      <button class="btn btn--primary" type="button" id="payBtn" data-click="payOrder" style="display:none">Complete Payment</button>
      <a class="btn btn--secondary" href="collection">Continue Shopping</a>
    </div>
  </main>

  <footer class="site-footer">
    <img class="footer__logo" src="logo_graffiti_orange.png" alt="Σenario">
    <p class="footer__slogan">A new form of luxury.<br>Built from reality, not status.</p>

    <div class="footer__socials">
      <a href="https://www.instagram.com/snrprojectt/" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="mailto:senarioproject@gmail.com" class="social-btn" aria-label="Email">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
      </a>
    </div>

    <nav class="footer__links">
      <a href="terms">Terms</a><a href="shipping-returns">Shipping &amp; Returns</a><a href="privacy">Privacy</a><a href="terms-el">Ελληνικά</a>
    </nav>
    <p class="footer__legal">© 2026 Σenario — All Rights Reserved</p>
  </footer>

  <script src="actions.js"></script>
  <script src="api.js"></script>
  <script src="js/order.js"></script>

</body>
</html>
