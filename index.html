<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Σenario</title>
  <meta name="description" content="Σenario — Urban streetwear.">

  <link rel="stylesheet" href="fonts/fonts.css">

  <style>
    :root {
      --white:   #ffffff;
      --black:   #0d0d0d;
      --olive:   #6B6B3A;
      --orange:  #C4622D;
      --gray:    #9A9A9A;
      --border:  #e8e8e4;
      --gap:     10px;

      --ff-display:   'Bebas Neue', sans-serif;
      --ff-condensed: 'Barlow Condensed', sans-serif;
      --ff-mono:      'DM Mono', monospace;
      --ff-heading:   'Space Grotesk', sans-serif;
      --ff-body:      'Suisse Intl', 'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    img  { display: block; max-width: 100%; }
    a    { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--ff-heading); font-weight: 500; }

    body {
      background: var(--black);
      color: var(--black);
      font-family: var(--ff-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── HEADER ─────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--black);
      padding: 0 40px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
    }

    .site-header__nav {
      display: flex;
      gap: 28px;
      padding-top: 32px;
    }

    .site-header__nav a {
      font-family: var(--ff-heading);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--orange);
      transition: color 0.2s;
    }

    .site-header__nav a:hover,
    .site-header__nav a.active { color: var(--white); }

    .site-header__actions {
      display: flex;
      align-items: center;
      gap: 18px;
      justify-content: flex-end;
      padding-top: 32px;
    }

    .site-header__actions a {
      font-family: var(--ff-heading);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--orange);
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .site-header__actions a:hover { color: var(--white); }

    .cart-link { position: relative; }
    .cart-badge {
      position: absolute; top: -8px; right: -10px;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; background: var(--orange); color: var(--white);
      font-family: var(--ff-body); font-size: 9px; line-height: 16px;
      text-align: center; display: none; align-items: center; justify-content: center;
    }

    .site-header__logo {
      width: 340px;
      height: auto;
      opacity: 0;
      transform: translateY(-8px);
      justify-self: center;
      margin-top: -24px;
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 14px 16px 12px;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "nav actions"
          "logo logo";
        row-gap: 10px;
        align-items: center;
      }
      .site-header__nav {
        grid-area: nav;
        display: flex;
        gap: 12px;
        padding-top: 0;
      }
      .site-header__nav a { font-size: 9.5px; letter-spacing: 0.06em; }
      .site-header__logo {
        grid-area: logo;
        width: 150px;
        margin-top: 0;
        justify-self: center;
      }
      .site-header__actions {
        grid-area: actions;
        padding-top: 0;
        gap: 14px;
      }
      .site-header__actions a span { display: none; }
      .grid-section { padding: 0 0 36px; }
      .footer__logo { width: 180px; }
    }

    /* ─── DIVIDER ─────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      padding: 0 var(--gap);
      margin-bottom: var(--gap);
      background: var(--black);
    }

    .divider__line  { flex: 1; height: 1px; background: var(--border); }
    .divider__gem   { width: 5px; height: 5px; transform: rotate(45deg); flex-shrink: 0; margin: 0 10px; }
    .divider--orange .divider__gem { background: var(--orange); }

    /* ─── PHOTO GRID ─────────────────────────────── */
    .grid-section {
      padding: 0 200px 80px;
      position: relative;
      background: var(--black);
    }

    .photo-grid {
      background: var(--white);
      columns: 4;
      column-gap: var(--gap);
      column-rule: 3px solid rgba(196, 98, 45, 0.55);
    }

    /* ─── EDITORIAL RAILS ────────────────────────── */
    .grid-rail {
      position: absolute;
      top: 0;
      bottom: 80px;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(196, 98, 45, 0.42) 6%,
        rgba(196, 98, 45, 0.42) 94%,
        transparent 100%
      );
    }

    .grid-rail--left  { left: 80px; }
    .grid-rail--right { right: 80px; }

    /* outward tick marks */
    .grid-rail::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 79px,
        rgba(196, 98, 45, 0.48) 79px,
        rgba(196, 98, 45, 0.48) 80px
      );
    }
    .grid-rail--left::before  { left: -9px; }
    .grid-rail--right::before { left: 1px; }

    /* inward shorter ticks at half interval */
    .grid-rail::after {
      content: '';
      position: absolute;
      top: 40px;
      bottom: 0;
      width: 5px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 39px,
        rgba(196, 98, 45, 0.28) 39px,
        rgba(196, 98, 45, 0.28) 40px
      );
    }
    .grid-rail--left::after  { left: 1px; }
    .grid-rail--right::after { right: 1px; }

    .grid-rail__gem {
      position: absolute;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(196, 98, 45, 0.55);
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .grid-rail__gem--top { top: 0; }
    .grid-rail__gem--mid { top: 50%; }
    .grid-rail__gem--bot { bottom: 0; transform: translate(-50%, 50%) rotate(45deg); }

    .grid-rail__label {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translateX(-50%) rotate(90deg);
      font-family: var(--ff-body);
      font-size: 7px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(196, 98, 45, 0.38);
      white-space: nowrap;
    }

    /* watermark — mirrored logo mark, stacked 3x to fill the gap between
       the photo grid and the editorial rail lines (80px–200px on each side) */
    .grid-watermark {
      position: absolute;
      top: 0;
      bottom: 80px;
      width: 120px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      display: flex;
      flex-direction: column;
      background: var(--white);
    }
    .grid-watermark--left  { left: 80px; }
    .grid-watermark--right { right: 80px; }

    .grid-watermark img {
      flex: 1 1 20%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.85;
      filter: blur(1.5px);
    }

    .grid-watermark--right img { transform: scaleX(-1); }

    /* horizontal connector at top of grid, linking both rails */
    .grid-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 80px;
      right: 80px;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(196, 98, 45, 0.38) 8%,
        rgba(196, 98, 45, 0.38) 92%,
        transparent
      );
      pointer-events: none;
    }

    /* horizontal connector at bottom of grid */
    .grid-section::after {
      content: '';
      position: absolute;
      bottom: 80px;
      left: 80px;
      right: 80px;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(196, 98, 45, 0.38) 8%,
        rgba(196, 98, 45, 0.38) 92%,
        transparent
      );
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .grid-rail { display: none; }
      .grid-watermark { display: none; }
      .grid-section::before,
      .grid-section::after { display: none; }
    }

    .grid-cell {
      position: relative;
      overflow: hidden;
      background: var(--black);
      opacity: 0;
      break-inside: avoid;
      margin-bottom: var(--gap);
      border-bottom: 3px solid rgba(196, 98, 45, 0.6);
      border-top: 3px solid rgba(196, 98, 45, 0.4);
    }

    .grid-caption {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--black);
      padding: 6px 10px 8px;
      max-width: 88%;
      z-index: 2;
      pointer-events: none;
    }

    .grid-caption__title {
      display: block;
      font-family: var(--ff-display);
      font-size: 13px;
      color: var(--orange);
      line-height: 1;
      letter-spacing: 0.06em;
    }

    .grid-caption__body {
      display: block;
      font-family: var(--ff-body);
      font-size: 7.5px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.05em;
      line-height: 1.45;
      margin-top: 4px;
    }

    .grid-cell img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  filter 0.45s ease;
      filter: grayscale(12%);
    }

    .grid-cell:hover img {
      transform: scale(1.04);
      filter: grayscale(0%);
    }

    .grid-cell img { cursor: default; }

    /* ─── MOBILE SLIDES (4 photos + shared caption) ── */
    .mood-slides { display: none; }
    .mood-dots { display: none; }

    @media (max-width: 768px) {
      .grid-section { padding: 0 0 48px; }

      /* desktop masonry is replaced entirely by the grouped slides below */
      .photo-grid { display: none; }

      .mood-slides {
        background: var(--white);
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mood-slides::-webkit-scrollbar { display: none; }

      .mood-slide {
        flex: 0 0 100%;
        max-width: 100%;
        scroll-snap-align: center;
        scroll-snap-stop: always;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
        height: 88vh;
      }

      .mood-slide__photo { overflow: hidden; }

      /* the overlay caption spans all 4 cells, so auto-flow can't place the
         photos around it — position them explicitly by DOM order */
      .mood-slide__photo:nth-of-type(1) { grid-area: 1 / 1; }
      .mood-slide__photo:nth-of-type(2) { grid-area: 1 / 2; }
      .mood-slide__photo:nth-of-type(4) { grid-area: 2 / 1; }
      .mood-slide__photo:nth-of-type(5) { grid-area: 2 / 2; }

      .mood-slide__photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .mood-slide__caption {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 18px;
      }

      .mood-slide__title {
        display: block;
        font-family: var(--ff-display);
        font-size: 22px;
        letter-spacing: 0.05em;
        color: var(--orange);
        line-height: 1.1;
        margin-bottom: 10px;
      }

      .mood-slide__body {
        display: block;
        font-family: var(--ff-body);
        font-size: 10px;
        letter-spacing: 0.06em;
        line-height: 1.6;
        color: rgba(255,255,255,0.75);
      }

      /* overlapping all 4 photos, centered, with a scrim so text stays legible */
      .mood-slide__caption--overlay {
        grid-column: 1 / 3;
        grid-row: 1 / 3;
        align-self: center;
        justify-self: center;
        z-index: 2;
        background: rgba(13, 13, 13, 0.55);
        max-width: 76%;
        pointer-events: none;
      }

      /* fills the leftover 4th cell when a slide only has 3 photos */
      .mood-slide__caption--cell {
        background: var(--white);
      }
      .mood-slide__caption--cell .mood-slide__body {
        color: rgba(13, 13, 13, 0.7);
      }

      /* page dots under the slides, like a multi-photo Instagram post */
      .mood-dots:not(:empty) {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        padding: 14px 16px 0;
      }
      .mood-dots button {
        width: 6px; height: 6px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);  /* sits on the black page background */
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      .mood-dots button.active {
        background: var(--orange);
        transform: scale(1.25);
      }
    }

    /* ─── FOOTER ─────────────────────────────────── */
    .site-footer {
      padding: 60px 24px 44px;
      text-align: center;
      background: var(--black);
    }

    .footer__logo {
      width: 260px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
      opacity: 0;
      transform: translateY(16px);
    }

    .footer__slogan {
      font-family: var(--ff-condensed);
      font-weight: 400;
      font-size: clamp(20px, 2.8vw, 34px);
      letter-spacing: 0.12em;
      color: var(--orange);
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 32px;
    }

    .footer__socials {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 36px;
    }

    .social-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }

    .social-btn:hover { border-color: var(--orange); color: var(--orange); }

    .footer__legal {
      font-family: var(--ff-body);
      font-size: 8px;
      letter-spacing: 0.18em;
      color: var(--border);
      text-transform: uppercase;
    }

    /* ─── ACCOUNT MENU ───────────────────────────── */
    .account-menu { position: relative; display: flex; align-items: center; }
    .account-menu__trigger {
      background: none; border: none; cursor: pointer;
      color: var(--white); display: flex; align-items: center;
      padding: 0; transition: color 0.2s;
    }
    .account-menu__trigger:hover { color: var(--orange); }
    .account-menu__dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--white); border: 1px solid var(--border);
      min-width: 190px; z-index: 200;
      display: none; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .account-menu__dropdown.open { display: flex; }
    .account-menu__dropdown a,
    .account-menu__dropdown button {
      font-family: var(--ff-body); font-size: 9px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--black);
      padding: 13px 16px; border: none; background: none;
      text-align: left; cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border-bottom: 1px solid var(--border);
      text-decoration: none; display: block; width: 100%;
    }
    .account-menu__dropdown button:last-child { border-bottom: none; }
    .account-menu__dropdown a:hover,
    .account-menu__dropdown button:hover { background: var(--black); color: var(--white); }
    .account-menu__dropdown .logout-btn { color: var(--gray); }
    .account-menu__dropdown .logout-btn:hover { background: var(--black); color: var(--orange); }

    /* ─── LIGHTBOX ───────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(13, 13, 13, 0.97);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lightbox__close {
      position: absolute;
      top: 20px; right: 24px; z-index: 10;
      background: none; border: none;
      color: rgba(255,255,255,0.35);
      font-size: 18px; cursor: pointer;
      transition: color 0.2s; line-height: 1;
      font-family: var(--ff-body);
    }
    .lightbox__close:hover { color: var(--white); }

    .lightbox__caption {
      padding: 20px 24px 0;
      font-family: var(--ff-body);
      font-size: 9px; letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      flex-shrink: 0;
      min-height: 36px;
    }

    .lightbox__stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .lightbox__stage.grabbing { cursor: grabbing; }

    .lightbox__img {
      display: block;
      max-width: 88vw;
      max-height: 76vh;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .lightbox__img.lb-instant { transition: none; }

    .lightbox__controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 14px 24px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .lb-btn {
      width: 36px; height: 36px;
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, color 0.18s;
      font-family: var(--ff-body);
      line-height: 1;
    }
    .lb-btn:hover { border-color: var(--orange); color: var(--orange); }
    .lb-btn--wide { width: auto; padding: 0 14px; font-size: 9px; letter-spacing: 0.2em; }

    .lb-scale {
      font-family: var(--ff-body);
      font-size: 10px; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.35);
      min-width: 52px; text-align: center;
    }

    .lb-sep {
      width: 1px; height: 22px;
      background: rgba(255,255,255,0.08);
      margin: 0 6px;
    }

    .lb-group-label {
      font-family: var(--ff-body);
      font-size: 7px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      padding: 0 4px;
    }

    .lightbox__hint {
      position: absolute;
      bottom: 74px; left: 0; right: 0;
      text-align: center;
      font-family: var(--ff-body);
      font-size: 8px; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.16);
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .lb-rot-side {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.75);
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      z-index: 5;
      line-height: 1;
    }
    .lb-rot-side:hover { background: var(--orange); border-color: var(--orange); color: var(--white); }
    .lb-rot-side--left  { left: 20px; }
    .lb-rot-side--right { right: 20px; }

    @media (max-width: 640px) {
      .lb-group-label { display: none; }
      .lb-sep { margin: 0 3px; }
      .lightbox__hint { display: none; }
      .lb-rot-side { width: 40px; height: 40px; font-size: 20px; }
      .lb-rot-side--left  { left: 10px; }
      .lb-rot-side--right { right: 10px; }
    }
      .footer__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 0 0 12px; }
    .footer__links a { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray, #9A9A9A); text-decoration: none; }
    .footer__links a:hover { color: var(--orange, #C4622D); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <nav class="site-header__nav">
      <a href="/" class="active">Moodboard</a>
      <a href="collection">Collection</a>
      <a href="concept">Concept</a>
      <a href="sale" id="navSale" style="display:none">Sale</a>
    </nav>

    <img class="site-header__logo"
         src="logo_graffiti_orange.png"
         alt="Σenario">

    <div class="site-header__actions">
      <a href="login" id="headerLogin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span>Login</span>
      </a>
      <div class="account-menu" id="accountMenu" style="display:none">
        <button class="account-menu__trigger" id="accountTrigger" aria-label="Account">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
        <div class="account-menu__dropdown" id="accountDropdown">
          <a href="account-orders">Orders</a>
          <a href="account-payments">Payment Methods</a>
