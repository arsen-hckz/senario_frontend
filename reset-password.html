<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Σenario</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;700&family=DM+Mono:wght@300;400&family=Space+Grotesk:wght@500&family=Inter:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --white:   #ffffff;
      --black:   #0d0d0d;
      --orange:  #C4622D;
      --gray:    #9A9A9A;
      --border:  #e8e8e4;
      --ff-heading:   'Space Grotesk', sans-serif;
      --ff-body:      'Suisse Intl', 'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    img  { display: block; max-width: 100%; }
    a    { color: inherit; text-decoration: none; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--ff-body);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .card img {
      width: 120px;
      margin: 0 auto 40px;
    }

    .state svg {
      margin: 0 auto 24px;
      display: block;
    }

    .heading {
      font-family: var(--ff-heading); font-weight: 500;
      font-size: 26px; line-height: 1.2;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 14px; line-height: 1.6;
      color: var(--gray);
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--white); color: var(--black);
      font-size: 9px; letter-spacing: 0.24em;
      text-transform: uppercase; font-weight: 400;
      border: none; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: var(--orange); color: var(--white); }

    .resend {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .resend p { font-size: 12px; color: var(--gray); margin-bottom: 14px; }

    .resend-form { display: flex; gap: 8px; }

    .resend-form input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--white);
      font-family: var(--ff-body); font-size: 13px;
      outline: none;
    }
    .resend-form input:focus { border-color: var(--white); }

    .resend-form button {
      padding: 0 18px;
      background: transparent;
      border: 1px solid var(--white);
      color: var(--white);
      font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .resend-form button:hover { background: var(--white); color: var(--black); }

    .resend-msg { font-size: 12px; color: var(--orange); margin-top: 12px; display: none; }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--white);
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    [hidden] { display: none !important; }

    .form { text-align: left; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 9px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gray); margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--white);
      font-family: var(--ff-body); font-size: 13px;
      outline: none;
    }
    .field input:focus { border-color: var(--white); }
    .form .btn { width: 100%; margin-top: 8px; }
    .form .btn:disabled { opacity: 0.5; cursor: default; }
    .err { font-size: 12px; color: #e0533d; margin-top: 12px; line-height: 1.5; }
    .back { display: inline-block; margin-top: 24px; font-size: 11px; color: var(--gray); }
    .back:hover { color: var(--white); }
  </style>
</head>
<body>

  <div class="card">
    <img src="logo_graffiti.png" alt="Σenario" style="filter:invert(1);">

    <div class="state" id="stateForm">
      <h1 class="heading">Choose a new password</h1>
      <p class="sub">At least 8 characters, and not something easy to guess.</p>
      <form class="form" id="resetForm">
        <div class="field">
          <label for="pass">New password</label>
          <input type="password" id="pass" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="passConfirm">Confirm password</label>
          <input type="password" id="passConfirm" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn" type="submit" id="submitBtn">Set new password</button>
        <p class="err" id="err" hidden></p>
      </form>
    </div>

    <div class="state" id="stateSuccess" hidden>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 12.5l2.5 2.5L16 9.5"/>
      </svg>
      <h1 class="heading">Password updated</h1>
      <p class="sub">You&rsquo;ve been signed out everywhere else. Sign in with your new password.</p>
      <a class="btn" href="login.html">Sign in</a>
    </div>

    <div class="state" id="stateInvalid" hidden>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v5"/><path d="M12 16h.01"/>
      </svg>
      <h1 class="heading">Link expired</h1>
      <p class="sub">This reset link is invalid, has expired or was already used. Reset links last 1 hour.</p>
      <a class="btn" href="forgot-password.html">Get a new link</a>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var uid = params.get('uid');
    var token = params.get('token');

    function showState(name) {
      document.getElementById('stateForm').hidden    = name !== 'form';
      document.getElementById('stateSuccess').hidden = name !== 'success';
      document.getElementById('stateInvalid').hidden = name !== 'invalid';
    }

    if (!uid || !token) showState('invalid');

    // Keep the token out of the address bar (and so out of history and
    // Referer headers) once it has been read.
    if (uid || token) history.replaceState(null, '', location.pathname);

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var pass = document.getElementById('pass').value;
      var confirm = document.getElementById('passConfirm').value;
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('err');
      err.hidden = true;

      if (pass !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.hidden = false;
        return;
      }

      btn.disabled = true;
      try {
        var res = await fetch(API_BASE + '/auth/password-reset/confirm/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({uid: uid, token: token, password: pass})
        });
        var d = await res.json().catch(function() { return {}; });
        if (res.ok) {
          // Any session this browser had is now revoked server-side.
          localStorage.removeItem('snr_token');
          localStorage.removeItem('snr_refresh');
          showState('success');
        } else if (d.non_field_errors) {
          showState('invalid');
        } else if (res.status === 429) {
          err.textContent = 'Too many attempts. Please wait a while and try again.';
          err.hidden = false;
        } else {
          err.textContent = (d.password && d.password.join(' ')) || d.detail || 'Could not reset your password. Please try again.';
          err.hidden = false;
        }
      } catch (ex) {
        err.textContent = 'Network error. Please try again.';
        err.hidden = false;
      }
      btn.disabled = false;
    });
  </script>

</body>
</html>
