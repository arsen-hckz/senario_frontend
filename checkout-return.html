<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — Σenario</title>

  <link rel="stylesheet" href="fonts/fonts.css">

  <style>
    :root {
      --white:   #ffffff;
      --black:   #0d0d0d;
      --orange:  #C4622D;
      --gray:    #9A9A9A;
      --border:  #e8e8e4;
      --green:   #2d7a3c;
      --ff-heading: 'Space Grotesk', sans-serif;
      --ff-body:    'Suisse Intl', 'Inter', sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    body {
      background: var(--white); color: var(--black);
      font-family: var(--ff-body); -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .site-header {
      padding: 24px 40px; text-align: center; border-bottom: 1px solid var(--border);
    }
    .site-header__logo { width: 200px; height: auto; margin: 0 auto; }

    .status-wrap {
      max-width: 520px; margin: 0 auto;
      padding: 90px 24px 100px;
      text-align: center;
    }
    .status-eyebrow {
      font-family: var(--ff-body); font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gray); margin-bottom: 20px;
    }
    .status-icon {
      width: 56px; height: 56px; margin: 0 auto 28px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
    }
    .status-icon svg { width: 24px; height: 24px; }
    .status-icon--spin {
      border-top-color: var(--black);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-title {
      font-family: var(--ff-heading); font-weight: 500; font-size: clamp(26px, 4vw, 36px);
      line-height: 1.2; margin-bottom: 14px;
    }
    .status-body {
      font-family: var(--ff-body); font-size: 12px; letter-spacing: 0.03em;
      color: var(--gray); line-height: 1.7; margin-bottom: 40px;
    }
    .status-order {
      font-family: var(--ff-body); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gray); margin-bottom: 40px;
    }
    .status-actions { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: inline-block; width: 100%; padding: 16px;
      font-family: var(--ff-body); font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer; border: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn--primary { background: var(--black); color: var(--white); }
    .btn--primary:hover { background: var(--orange); }
    .btn--secondary { background: none; color: var(--black); border: 1px solid var(--border); }
    .btn--secondary:hover { border-color: var(--black); }

    .site-footer { padding: 32px 24px; border-top: 1px solid var(--border); text-align: center; }
    .footer__legal { font-family: var(--ff-body); font-size: 8px; letter-spacing: 0.18em; color: var(--gray); text-transform: uppercase; }
      .footer__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 0 0 12px; }
    .footer__links a { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray, #9A9A9A); text-decoration: none; }
    .footer__links a:hover { color: var(--orange, #C4622D); }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <header class="site-header">
    <a href="/"><img class="site-header__logo" src="logo_mark_transparent_orange.png" alt="Σenario"></a>
  </header>

  <div class="status-wrap">
    <p class="status-eyebrow">Σenario / Payment</p>
    <div class="status-icon status-icon--spin" id="statusIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
    </div>
    <h1 class="status-title" id="statusTitle">Confirming your payment</h1>
    <p class="status-body" id="statusBody">
      This only takes a moment — please don't close this page.
    </p>
    <p class="status-order" id="statusOrder"></p>
    <div class="status-actions" id="statusActions" style="display:none"></div>
  </div>

  <footer class="site-footer">
    <img class="footer__logo" src="logo_graffiti_orange.png" alt="Σenario">
    <p class="footer__slogan">A new form of luxury.<br>Built from reality, not status.</p>

    <div class="footer__socials">
      <a href="https://www.instagram.com/snrprojectt/" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="mailto:senarioproject@gmail.com" class="social-btn" aria-label="Email">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
      </a>
    </div>

    <nav class="footer__links"><a href="terms">Terms</a><a href="shipping-returns">Shipping &amp; Returns</a><a href="privacy">Privacy</a><a href="terms-el">Ελληνικά</a></nav>
    <p class="footer__legal">© 2025 Σenario — All Rights Reserved</p>
  </footer>

  <script src="actions.js"></script>
  <script src="api.js"></script>
  <script src="js/checkout-return.js"></script>

</body>
</html>
