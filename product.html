<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item — Σenario</title>

  <link rel="stylesheet" href="fonts/fonts.css">

  <style>
    :root {
      --white:   #ffffff;
      --black:   #0d0d0d;
      --olive:   #6B6B3A;
      --orange:  #C4622D;
      --gray:    #9A9A9A;
      --border:  #e8e8e4;
      --gap:     10px;

      --ff-display:   'Bebas Neue', sans-serif;
      --ff-condensed: 'Barlow Condensed', sans-serif;
      --ff-mono:      'DM Mono', monospace;
      --ff-heading:   'Space Grotesk', sans-serif;
      --ff-body:      'Suisse Intl', 'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    img  { display: block; max-width: 100%; }
    a    { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--ff-heading); font-weight: 500; }

    body {
      background: var(--white);
      color: var(--black);
      font-family: var(--ff-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── HEADER ─────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      padding: 0 40px 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
    }

    .site-header__nav {
      display: flex;
      gap: 28px;
      padding-top: 22px;
    }

    .site-header__nav a {
      font-family: var(--ff-heading);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      transition: color 0.2s;
    }

    .site-header__nav a:hover,
    .site-header__nav a.active { color: var(--black); }

    .site-header__actions {
      display: flex;
      align-items: center;
      gap: 18px;
      justify-content: flex-end;
      padding-top: 22px;
    }

    .site-header__actions a {
      font-family: var(--ff-heading);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--black);
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .site-header__actions a:hover { color: var(--orange); }

    .cart-link { position: relative; }
    .cart-badge {
      position: absolute; top: -8px; right: -10px;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; background: var(--orange); color: var(--white);
      font-family: var(--ff-body); font-size: 9px; line-height: 16px;
      text-align: center; display: none; align-items: center; justify-content: center;
    }

    .site-header__logo {
      width: 260px;
      height: auto;
      justify-self: center;
      margin-top: 0;
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 14px 16px 12px;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "nav actions"
          "logo logo";
        row-gap: 10px;
        align-items: center;
      }
      .site-header__nav {
        grid-area: nav;
        display: flex;
        gap: 12px;
        padding-top: 0;
      }
      .site-header__nav a { font-size: 9.5px; letter-spacing: 0.06em; }
      .site-header__logo { grid-area: logo; width: 150px; margin-top: 0; justify-self: center; }
      .site-header__actions { grid-area: actions; padding-top: 0; gap: 14px; }
      .site-header__actions a span { display: none; }
      .breadcrumb { padding: 12px 16px; }
      .product-details { padding: 28px 20px 48px; }
    }

    /* ─── BREADCRUMB ─────────────────────────────── */
    .breadcrumb {
      padding: 16px 40px;
      font-family: var(--ff-body);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      border-bottom: 1px solid var(--border);
    }

    .breadcrumb a { transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--orange); }
    .breadcrumb span { margin: 0 8px; }

    /* ─── PRODUCT VIEW ───────────────────────────── */
    .product-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 200px);
    }

    @media (max-width: 768px) {
      .product-view { grid-template-columns: 1fr; }
    }

    /* ─── IMAGE SIDE ─────────────────────────────── */
    .product-images {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--border);
    }

    .product-images img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 40px;
    }

    @media (max-width: 768px) {
      .product-images {
        position: relative;
        height: 60vw;
        min-height: 320px;
      }
    }

    /* gallery controls: only shown when a product has more than one photo */
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px; height: 40px;
      border: none;
      background: rgba(255,255,255,0.85);
      color: var(--black);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .gallery-nav:hover { background: var(--black); color: var(--white); }
    .gallery-nav--prev { left: 16px; }
    .gallery-nav--next { right: 16px; }

    /* Desktop: the panel is a full viewport tall and starts below the header,
       so its bottom edge is off-screen until you scroll; keep thumbs on top. */
    .gallery-thumbs {
      position: absolute;
      left: 0; right: 0; top: 16px;
      display: flex; justify-content: center; gap: 8px;
      padding: 0 16px;
      overflow-x: auto;
    }
    .gallery-thumbs button {
      flex: 0 0 auto;
      width: 52px; height: 52px;
      padding: 0;
      border: 1px solid transparent;
      background: var(--white);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .gallery-thumbs button.active,
    .gallery-thumbs button:hover { opacity: 1; border-color: var(--black); }
    .product-images.has-thumbs > img { padding-top: 84px; }
    .product-images .gallery-thumbs img {
      width: 100%; height: 100%;
      object-fit: cover;
      padding: 0;
    }

    @media (max-width: 768px) {
      .gallery-nav { width: 32px; height: 32px; font-size: 15px; }
      .gallery-nav--prev { left: 8px; }
      .gallery-nav--next { right: 8px; }
      .gallery-thumbs { top: auto; bottom: 8px; }
      .product-images.has-thumbs > img { padding-top: 40px; padding-bottom: 56px; }
      .gallery-thumbs button { width: 40px; height: 40px; }
    }

    /* ─── DETAILS SIDE ───────────────────────────── */
    .product-details {
      padding: 56px 56px 80px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .product-details__eyebrow {
      font-family: var(--ff-body);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 12px;
    }

    .product-details__name {
      font-family: var(--ff-display);
      font-size: clamp(40px, 5vw, 64px);
      line-height: 1;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    .product-details__price {
      font-family: var(--ff-body);
      font-size: 18px;
      letter-spacing: 0.1em;
      margin-bottom: 36px;
    }

    .product-details__divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 36px;
    }

    /* Sizes */
    .product-details__label {
      font-family: var(--ff-body);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 12px;
    }

    .size-grid {
      display: flex;
      gap: 8px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .size-btn {
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      background: none;
      font-family: var(--ff-body);
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }

    .size-btn:hover,
    .size-btn.selected {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }

    /* Quantity */
    .qty-stepper {
      display: flex;
      align-items: center;
      width: 132px;
      border: 1px solid var(--border);
      margin-bottom: 36px;
    }

    .qty-btn {
      width: 40px;
      height: 44px;
      border: none;
      background: none;
      font-family: var(--ff-body);
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .qty-btn:hover { background: var(--black); color: var(--white); }
    .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .qty-value {
      flex: 1;
      text-align: center;
      font-family: var(--ff-body);
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    /* Add to Cart */
    .btn-atc {
      width: 100%;
      padding: 18px;
      background: var(--black);
      color: var(--white);
      border: none;
      font-family: var(--ff-body);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 12px;
    }

    .btn-atc:hover { background: var(--orange); }

    .btn-atc.added {
      background: var(--orange);
      pointer-events: none;
    }

    .btn-wishlist {
      width: 100%;
      padding: 16px;
      background: none;
      color: var(--black);
      border: 1px solid var(--border);
      font-family: var(--ff-body);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 40px;
      display: block;
      text-align: center;
    }

    .btn-wishlist:hover { border-color: var(--orange); color: var(--orange); }

    /* Description */
    .product-details__desc {
      font-family: var(--ff-body);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--gray);
      border-top: 1px solid var(--border);
      padding-top: 28px;
    }

    /* ─── FOOTER ─────────────────────────────────── */
    .site-footer {
      padding: 60px 24px 44px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer__logo {
      width: 200px;
      height: auto;
      margin: 0 auto 14px;
      display: block;
    }

    .footer__slogan {
      font-family: var(--ff-body);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--gray);
      text-transform: uppercase;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .footer__socials {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 36px;
    }

    .social-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }

    .social-btn:hover { border-color: var(--orange); color: var(--orange); }

    .footer__legal {
      font-family: var(--ff-body);
      font-size: 8px;
      letter-spacing: 0.18em;
      color: var(--border);
      text-transform: uppercase;
    }

    /* ─── ACCOUNT MENU ───────────────────────────── */
    .account-menu { position: relative; display: flex; align-items: center; }
    .account-menu__trigger {
      background: none; border: none; cursor: pointer;
      color: var(--black); display: flex; align-items: center;
      padding: 0; transition: color 0.2s;
    }
    .account-menu__trigger:hover { color: var(--orange); }
    .account-menu__dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--white); border: 1px solid var(--border);
      min-width: 190px; z-index: 200;
      display: none; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .account-menu__dropdown.open { display: flex; }
    .account-menu__dropdown a,
    .account-menu__dropdown button {
      font-family: var(--ff-body); font-size: 9px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--black);
      padding: 13px 16px; border: none; background: none;
      text-align: left; cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border-bottom: 1px solid var(--border);
      text-decoration: none; display: block; width: 100%;
    }
    .account-menu__dropdown button:last-child { border-bottom: none; }
    .account-menu__dropdown a:hover,
    .account-menu__dropdown button:hover { background: var(--black); color: var(--white); }
    .account-menu__dropdown .logout-btn { color: var(--gray); }
    .account-menu__dropdown .logout-btn:hover { background: var(--black); color: var(--orange); }
      .footer__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 0 0 12px; }
    .footer__links a { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray, #9A9A9A); text-decoration: none; }
    .footer__links a:hover { color: var(--orange, #C4622D); }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <nav class="site-header__nav">
      <a href="/">Moodboard</a>
      <a href="collection" class="active">Collection</a>
      <a href="concept">Concept</a>
      <a href="sale" id="navSale" style="display:none">Sale</a>
    </nav>

    <a href="/">
      <img class="site-header__logo" src="logo_mark_transparent_orange.png" alt="Σenario">
    </a>

    <div class="site-header__actions">
      <a href="login" id="headerLogin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Login</span></a>
      <div class="account-menu" id="accountMenu" style="display:none">
        <button class="account-menu__trigger" id="accountTrigger" aria-label="Account">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
        <div class="account-menu__dropdown" id="accountDropdown">
          <a href="account-orders">Orders</a>
          <a href="account-payments">Payment Methods</a>
          <a href="account-preferences">Preferences</a>
          <a href="admin" id="adminLink" style="display:none">Admin Dashboard</a>
          <button class="logout-btn" data-click="logout">Logout</button>
        </div>
      </div>
      <a href="cart" aria-label="Cart" class="cart-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" id="cartBadge"></span>
      </a>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <a href="collection">Collection</a>
    <span>/</span>
    <span id="bc-name">—</span>
  </div>

  <!-- PRODUCT VIEW -->
  <div class="product-view">
    <div class="product-images" id="gallery">
      <img id="prod-img" src="" alt="">
      <button type="button" class="gallery-nav gallery-nav--prev" id="galleryPrev" aria-label="Previous photo" hidden>&larr;</button>
      <button type="button" class="gallery-nav gallery-nav--next" id="galleryNext" aria-label="Next photo" hidden>&rarr;</button>
      <div class="gallery-thumbs" id="galleryThumbs" hidden></div>
    </div>
    <div class="product-details">
      <p class="product-details__eyebrow">Σenario / SS 2025</p>
      <h1 class="product-details__name" id="prod-name">—</h1>
      <p class="product-details__price" id="prod-price">€—</p>
      <div class="product-details__divider"></div>
      <p class="product-details__label" id="size-label">Size</p>
      <div class="size-grid" id="size-grid"></div>
      <p class="product-details__label">Quantity</p>
      <div class="qty-stepper" id="qty-stepper">
        <button type="button" class="qty-btn" id="qty-minus" aria-label="Decrease quantity">−</button>
        <span class="qty-value" id="qty-value">1</span>
        <button type="button" class="qty-btn" id="qty-plus" aria-label="Increase quantity">+</button>
      </div>
      <button class="btn-atc">Add to Cart</button>
      <a class="btn-wishlist" href="checkout">Buy it Now</a>
      <p class="product-details__desc" id="prod-desc"></p>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <img class="footer__logo" src="logo_graffiti_orange.png" alt="Σenario">
    <p class="footer__slogan">A new form of luxury.<br>Built from reality, not status.</p>

    <div class="footer__socials">
      <a href="https://www.instagram.com/snrprojectt/" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="mailto:senarioproject@gmail.com" class="social-btn" aria-label="Email">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
      </a>
    </div>

    <nav class="footer__links"><a href="terms">Terms</a><a href="shipping-returns">Shipping &amp; Returns</a><a href="privacy">Privacy</a><a href="terms-el">Ελληνικά</a></nav>
    <p class="footer__legal">© 2026 Σenario — All Rights Reserved</p>
  </footer>

  <script src="posts-data.js"></script>
  <script src="actions.js"></script>
  <script src="api.js"></script>
  <script src="js/product.js"></script>

</body>
</html>
